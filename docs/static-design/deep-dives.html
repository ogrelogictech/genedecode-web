<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="color-scheme" content="dark" /><title>Gene Decode — Deep Dives</title>
<link rel="icon" href="assets/logo.png" /><link rel="stylesheet" href="styles.css" />
</head><body data-page="deep-dives">
<div id="site-header"></div>

<section class="pagehero"><div class="wrap">
  <span class="kicker">Members library</span>
  <h1>Deep Dives</h1>
  <p>Every Deep Dive video, Q&amp;A Zoom, exclusive decode, and the monthly content, in one place. Pick up where you left off on any device.</p>
</div></section>

<section><div class="wrap">
  <div class="rowhead"><h2><span class="bar"></span>Continue watching</h2></div>
  <div class="rowscroll" id="row-continue"></div>

  <div class="rowhead" style="margin-top:40px"><h2><span class="bar"></span>Browse the library</h2></div>
  <div class="chips" id="dd-chips">
    <span class="chip on" data-val="All">All</span>
    <span class="chip" data-val="Deep Dive">Deep Dives</span>
    <span class="chip" data-val="Pearls of Wisdom">Pearls of Wisdom</span>
    <span class="chip" data-val="Q&amp;A">Q&amp;A Zooms</span>
  </div>
  <div class="grid" id="grid-dd"></div>
</div></section>

<div id="site-footer"></div>
<script src="app.js"></script><script src="catalog.js"></script>
<script>
  render("row-continue", VIDEOS.filter(function(v){return v.p>0}));
  function ddList(val){ return val==="All" ? VIDEOS : byCat(val); }
  render("grid-dd", ddList("All"));
  wireChips("#dd-chips", "grid-dd", ddList);
</script>
</body></html>
